[tool.isort]
profile = "black"
line_length = 100
# Always place imports at the top when sorting
float_to_top = true

# Enforce grouping and ordering
sections = ["STDLIB", "THIRDPARTY", "FIRSTPARTY"]
default_section = "THIRDPARTY"
known_first_party = ["mlc_dashboard"]

# Keep imports consolidated and deduplicated
combine_as_imports = true
force_sort_within_sections = true
dedup_headings = true
lines_between_sections = 1

[tool.black]
line-length = 100


